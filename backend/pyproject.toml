[project]
name = "tech-research-agent-backend"
version = "0.1.0"
description = "A simple backend for the Tech Research Agent project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi>=0.141.1",
    "llama-index>=0.14.25",
    "numpy>=2.5.3",
    "openrouter>=1.2.31",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
